name: IndexNow

# Vercel rapporterar varje deploy till GitHub som en deployment med status.
# När en produktionsdeploy är klar skickas alla URL:er i sitemapen till IndexNow
# (Bing m.fl.), se scripts/indexnow.mjs. Inga hemligheter behövs: nyckeln är publik.
on:
  deployment_status:

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: true

jobs:
  indexnow:
    name: Skicka URL:er till IndexNow
    # Vercel kallar miljön "Production" (ibland med projektnamn efter, t.ex. "Production – min-hemsida").
    # startsWith jämför utan hänsyn till skiftläge, så även "production" fångas.
    if: >-
      github.event.deployment_status.state == 'success' &&
      startsWith(github.event.deployment.environment, 'production')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/indexnow.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Ett misslyckat anrop loggas som varning men fäller inte arbetsflödet.
      - name: Skicka sitemapens URL:er
        continue-on-error: true
        timeout-minutes: 2
        run: node scripts/indexnow.mjs
