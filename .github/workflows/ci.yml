name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, typer, bygge och röktest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installera beroenden
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typkontroll
        run: npm run typecheck

      - name: Cacha Next.js-byggcache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'components/**', 'data/**') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Bygg
        run: npm run build

      - name: Installera Chromium för röktestet
        run: npx playwright install --with-deps chromium

      - name: Röktest (sitemap, h1, headers, konsolfel)
        run: npm run smoke
